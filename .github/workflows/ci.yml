name: SOFA tests and static checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test tools
        run: python -m pip install 'pytest>=8,<10' 'ruff>=0.12,<1'
      - name: Run Python tests
        run: python -m pytest -q
      - name: Check Python syntax and lint
        run: |
          python -m compileall -q sofa.py cli.py test_sofa.py
          ruff check . --select E,F,W
  browser-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          for file in *.mjs; do node --check "$file"; done
      - name: Test browser input and delta validation
        run: node --test web-input.test.mjs
